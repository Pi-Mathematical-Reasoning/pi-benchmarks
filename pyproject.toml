[project]
name = "pi-benchmarks"
# Never published: the tool runs from a checkout. This number is not the
# release version, which Release Please keeps in version.txt.
version = "0.0.0"
description = "Manifests and tooling for Pi's benchmark data, mirrored in a private S3 bucket."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
pi-benchmarks = "pi_benchmarks.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
